<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html { background: #001820; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    background-image: url('../assets/cover-bg.png');
    background-size: cover;
    background-position: center;
  }
  .wrap {
    margin: 56pt 64pt 48pt 72pt;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 100%;
  }
  .eyebrow {
    color: #00B7C3;
    font-size: 11pt;
    letter-spacing: 3pt;
    text-transform: uppercase;
    margin: 0 0 18pt 0;
  }
  h1 {
    color: #FFFFFF;
    font-size: 36pt;
    font-weight: bold;
    margin: 0;
    line-height: 1.15;
  }
  .sub {
    color: #B8D4DE;
    font-size: 15pt;
    margin: 18pt 0 0 0;
    line-height: 1.4;
    max-width: 460pt;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .meta {
    color: #8AA8B4;
    font-size: 11pt;
    margin: 0;
  }
  .brand {
    color: #EC0051;
    font-size: 11pt;
    font-weight: bold;
    margin: 0;
    letter-spacing: 1pt;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <p class="eyebrow">AviLease · Data platform briefing</p>
      <h1>One number<br/>for the fleet</h1>
      <p class="sub">Ops and the board — same aircraft, same rent, same truth. Microsoft Fabric across Leaseworks, Core Financial, and Aerlytix.</p>
    </div>
    <div class="foot">
      <p class="meta">Enterprise architecture demo · Confidential</p>
      <p class="brand">PRODIGY</p>
    </div>
  </div>
</body>
</html>
